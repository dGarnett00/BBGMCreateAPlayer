<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate and manage draft prospects for your basketball simulation.">
  <title>Draft Prospect Generator</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <header>
    <h1>Draft Prospect Generator</h1>
  </header>

  <main>
    <section id="newEntrySection" class="card">
      <h2>Create a draft prospect. Scroll down to import/edit a draft class</h2>
      <div id="jsonFormContainer" class="mt-1"></div>
      <button id="saveJsonBtn" class="primary-btn mt-1">Save</button>
      
      <div class="button-row">
        <button id="generateRandomPlayerBtn" class="primary-btn">Generate Random Player</button>
        <span id="bulkGenerateBtnPlaceholder"></span>
      </div>
    </section>

    <section id="outputSection" class="card output-section">
      <h2>Draft Class</h2>
      <div id="totalPlayersDisplay" class="total-players-display" aria-live="polite"></div>
      <div id="playerTableContainer"></div>
      
      <details class="details-margin-top">
        <summary>📦 JSON Output (Export Preview)</summary>
        <pre id="outputJson" tabindex="0" aria-label="Draft class JSON export preview"></pre>
      </details>
    </section>

    <hr class="my-2">
    
    <label for="jsonInput" class="file-label">Import JSON File:</label>
    <input type="file" id="jsonInput" accept=".json">
  </main>

  <footer>
    <p>&copy; 2025 Draft Prospect Generator</p>
  </footer>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>
